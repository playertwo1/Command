appId: br.com.guimaraesdona.companion
---
# Fluxo E2E Maestro — Validação Command v0.6.0
- launchApp:
    clearState: false

# Verifica visibilidade das três abas de navegação
- assertVisible: ".*Status.*"
- assertVisible: ".*Deck.*"
- assertVisible: ".*Audio.*"

# Navega para a aba Deck e valida
- tapOn:
    text: ".*Deck.*"
- assertVisible: ".*Deck.*"

# Navega para a aba Audio e valida
- tapOn:
    text: ".*Audio.*"
- assertVisible: ".*Audio.*"

# Retorna para a aba Status e inspeciona telemetria e cards
- tapOn:
    text: ".*Status.*"
- assertVisible: ".*Status.*"

# Rola para baixo para inspecionar cards de rotinas, controle de sessão e histórico
- scroll
- scroll
